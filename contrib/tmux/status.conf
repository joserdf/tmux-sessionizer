# Agent status in the tmux window list, from the window options the
# showrunner daemon publishes (requires `showrunner serve` running):
#
#   @agent_status  permission | question | error | done | working | idle | (empty)
#   @agent_idle    quiet time when idle/done, e.g. 12m, 3h (empty under a minute)
#
# Usage: source it from ~/.tmux.conf AFTER your theme, then adapt the formats:
#   source-file ~/tmux-sessionizer/contrib/tmux/status.conf
# Not installed automatically.

# Glyph per status. `#,` is a literal comma inside #{?...}.
set -g @agent_glyph "#{?#{==:#{@agent_status},permission},#[fg=red]● ,#{?#{==:#{@agent_status},question},#[fg=yellow]? ,#{?#{==:#{@agent_status},error},#[fg=red]✗ ,#{?#{==:#{@agent_status},done},#[fg=green]✓ ,#{?#{==:#{@agent_status},working},#[fg=blue]… ,}}}}}#[default]"
set -g @agent_quiet "#{?#{@agent_idle}, #[dim]#{@agent_idle}#[default],}"

set -g window-status-format         "#{E:@agent_glyph}#I:#W#{E:@agent_quiet}"
set -g window-status-current-format "#{E:@agent_glyph}#[bold]#I:#W#[nobold]#{E:@agent_quiet}"
